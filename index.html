<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Vived Games (Intro)</title>
    <link rel="stylesheet" href="css/intro.css">
</head>
<body>

<audio id="bgMusic" src="assets/audio/slava-funk.mp3" loop></audio>

<button class="admin-btn" type="button" onclick="openAdmin()">ADMIN</button>

<div class="admin-panel" id="adminPanel">
    <h2>ADMIN PANEL</h2>
    <div class="admin-info" id="adminInfo"></div>

    <div class="admin-actions">
        <button class="pass-btn" type="button" onclick="changePassword()">Change Password</button>
        <button class="logout-btn" type="button" onclick="logoutAdmin()">Logout</button>
    </div>

    <input id="sceneSearch" class="admin-search" placeholder="Search scene text..." oninput="searchScenes()">

    <div class="admin-grid" id="sceneGrid"></div>
</div>

<div id="title1" class="title show">Vived Games</div>
<div id="title2" class="title">Song By MVSTERIOUS</div>
<div id="title3" class="title">Site Made By VVX, Reygriff</div>
<div id="title4" class="title">
    Vived Games<span class="reg">®</span> | Games are the player's flames
</div>

<div id="auraScene" class="aura-scene">
    <div id="title5" class="title">Games Filled With AURA Are Coming Soon</div>
    <button id="launchBtn" class="launch-btn" type="button">Launch Website</button>
</div>

<div id="title6" class="title">Window Closing By Its Own</div>
<div id="countdown" class="title"></div>

<script src="js/intro.js"></script>
</body>
</html>
