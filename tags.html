<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vived Games | Tags</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    min-height: 100vh;
    background: url("tagsimg.png") no-repeat center center fixed;
    background-size: cover;
    font-family: Arial, sans-serif;
    color: white;
}

/* OVERLAY FOR READABILITY */
.overlay {
    background: rgba(0,0,0,0.65);
    min-height: 100vh;
    padding: 40px 20px;
}

/* TITLE */
.page-title {
    text-align: center;
    font-size: 42px;
    margin-bottom: 40px;
}

/* TAG LIST */
.tags-list {
    max-width: 800px;
    margin: 0 auto;
}

.tag-item {
    background: rgba(0,0,0,0.6);
    border-left: 5px solid #1aff4c;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 8px;
}

.tag-name {
    font-size: 22px;
    margin-bottom: 6px;
}

.tag-desc {
    font-size: 16px;
    color: #ddd;
}

/* LEARN MORE */
.learn-more {
    text-align: center;
    margin-top: 50px;
}

.learn-more a {
    color: #1aff4c;
    font-size: 18px;
    text-decoration: none;
}

.learn-more a:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<div class="overlay">

    <div class="page-title">Vived Games | Tags</div>

    <div class="tags-list">

        <div class="tag-item">
            <div class="tag-name">Verified</div>
            <div class="tag-desc">Become a verified player</div>
        </div>

        <div class="tag-item">
            <div class="tag-name">Player</div>
            <div class="tag-desc">Become a player of Vived Games</div>
        </div>

        <div class="tag-item">
            <div class="tag-name">Verified Studio Game Developer</div>
            <div class="tag-desc">Become a dev for Vived Games</div>
        </div>

        <div class="tag-item">
            <div class="tag-name">Admin</div>
            <div class="tag-desc">Help in game developing</div>
        </div>

    </div>

    <div class="learn-more">
        <a href="tagslearn.html">Learn more</a>
    </div>

</div>

</body>
</html>
