<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vived Games Verification Email</title>
</head>
<body style="margin:0;padding:0;background:#0b0b0b;font-family:Arial,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background:#0b0b0b;padding:40px 16px;">
        <tr>
            <td align="center">
                <table width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#141414;border:1px solid rgba(255,255,255,0.08);border-radius:16px;overflow:hidden;">
                    <tr>
                        <td style="background:linear-gradient(135deg,#2d1b4e,#9b59b6);padding:28px 32px;text-align:center;">
                            <h1 style="margin:0;color:#ffffff;font-size:26px;">Vived Games</h1>
                            <p style="margin:8px 0 0;color:rgba(255,255,255,0.85);font-size:14px;">{{purpose_title}}</p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:32px;color:#e8e8e8;">
                            <p style="margin:0 0 16px;font-size:16px;line-height:1.6;">
                                Hello <strong style="color:#c084fc;">{{display_name}}</strong>,
                            </p>
                            <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#cccccc;">
                                {{purpose_message}}
                            </p>
                            <table width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:24px;">
                                <tr>
                                    <td align="center" style="background:#0b0b0b;border:2px dashed #9b59b6;border-radius:12px;padding:24px;">
                                        <span style="font-size:36px;font-weight:700;letter-spacing:10px;color:#c084fc;">{{verification_code}}</span>
                                    </td>
                                </tr>
                            </table>
                            <p style="margin:0 0 8px;font-size:14px;line-height:1.7;color:#aaaaaa;white-space:pre-line;">{{account_details}}</p>
                            <p style="margin:16px 0 0;font-size:13px;line-height:1.6;color:#888888;">
                                {{footer_message}}
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:20px 32px;border-top:1px solid rgba(255,255,255,0.06);text-align:center;">
                            <p style="margin:0;font-size:12px;color:#666666;">
                                &copy; 2026 Vived Games
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
